  <rect x="60" y="315" width="200" height="34" rx="17" fill="#0D6EA6"/>
  <text x="160" y="338" font-size="18" font-weight="700" fill="#FFFFFF">Sức khỏe của mọi nhà</text>
</g>
</svg>
