  <g>
    <rect x="135" y="95" width="50" height="17" rx="4" fill="#E85D75"/>
    <rect x="152" y="78" width="17" height="50" rx="4" fill="#E85D75"/>
  </g>

  <circle cx="123" cy="195" r="8" fill="#2A2A2A"/>
  <circle cx="197" cy="195" r="8" fill="#2A2A2A"/>
  <circle cx="126" cy="192" r="2.5" fill="#FFFFFF"/>
  <circle cx="200" cy="192" r="2.5" fill="#FFFFFF"/>

  <path d="M 128 222 Q 160 244 192 222" 
