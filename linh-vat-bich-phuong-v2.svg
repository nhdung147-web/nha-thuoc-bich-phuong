<svg width="320" height="380" viewBox="0 0 320 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Linh vật nhà thuốc Bích Phượng</title>
<desc>Viên thuốc hoạt hình dễ thương ôm chữ thập y tế, chữ Bích Phượng và Sức khỏe của mọi nhà</desc>

<rect x="0" y="0" width="320" height="380" rx="24" fill="#FFFFFF"/>

<ellipse cx="160" cy="215" rx="75" ry="12" fill="#000000" opacity="0.06"/>

<g>
  <path d="M 80 130 
