  <circle cx="105" cy="208" r="10" fill="#FF9EAD" opacity="0.6"/>
  <circle cx="215" cy="208" r="10" fill="#FF9EAD" opacity="0.6"/>

  <ellipse cx="52" cy="180" rx="19" ry="12" fill="#4FC3E8" stroke="#2A9BC1" stroke-width="3" transform="rotate(-20 52 180)"/>
  <ellipse cx="268" cy="180" rx="19" ry="12" fill="#4FC3E8" stroke="#2A9BC1" stroke-width="3" transform="rotate(20 268 180)"/>

  <circle cx="165" cy="55" r="5" fill="#FFD166"/>
  <circle cx="182" cy="46" r="3.5" fill="#FFD166"/>
